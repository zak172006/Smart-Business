

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Smart Business</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            Smart<span>Business</span>
        </div>

        <button class="login" onclick="logout()">
            Logout
        </button>
    </header>

    <main class="dashboard">

        <h1>Business Dashboard</h1>

        <p id="welcomeMessage">Welcome!</p>

        <section class="service-container">

            <div class="service-card">
                <div class="service-icon">📦</div>
                <h3>Products</h3>
                <p id="productCount">0 Products</p>
            </div>

            <div class="service-card">
                <div class="service-icon">👥</div>
                <h3>Customers</h3>
                <p>Customer Management</p>
            </div>

            <div class="service-card">
                <div class="service-icon">🛒</div>
                <h3>Orders</h3>
                <p>Order Management</p>
            </div>

        </section>

        <section class="about">
            <h2>Business Information</h2>
            <p id="businessName"></p>
            <p id="businessType"></p>
            <p id="userEmail"></p>
        </section>

        <!-- PRODUCT MANAGEMENT -->

        <section class="about">

            <h2>Product Management</h2>

            <p>Add and manage your business products.</p>

            <form id="productForm" onsubmit="addProduct(event)">

                <label for="productName">Product Name</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                >

                <label for="productPrice">Product Price</label>
                <input
                    type="number"
                    id="productPrice"
                    placeholder="Enter price"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="productQuantity">Product Quantity</label>
                <input
                    type="number"
                    id="productQuantity"
                    placeholder="Enter quantity"
                    min="0"
                    step="1"
                    required
                >

                <button type="submit" class="signup">
                    Add Product
                </button>

            </form>

            <h2>My Products</h2>

            <p id="emptyProducts">
                No products added yet.
            </p>

            <div style="overflow-x:auto;">

                <table id="productsTable" style="width:100%; text-align:left; display:none;">

                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productsList"></tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

    <script>
        const currentEmail = localStorage.getItem("smartBusinessCurrentUser");

        const users = JSON.parse(
            localStorage.getItem("smartBusinessUsers") || "[]"
        );

        const user = users.find(item => item.email === currentEmail);

        if (!user) {
            window.location.href = "login.html";
        } else {
            document.getElementById("welcomeMessage").textContent =
                "Welcome, " + user.fullName;

            document.getElementById("businessName").textContent =
                "Business Name: " + user.businessName;

            document.getElementById("businessType").textContent =
                "Business Type: " + user.businessType;

            document.getElementById("userEmail").textContent =
                "Email: " + user.email;

            loadProducts();
        }
    </script>

</body>
</html>
